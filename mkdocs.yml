site_name: Matteo Meli
site_url: https://matteomeli.github.io
theme:
  name: material
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: teal
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: teal
      accent: deep purple
  font:
    text: Merriweather Sans
    code: JetBrains Mono
  icon:
    logo: fontawesome/solid/m
  favicon: assets/images/controller.svg
  features:
    - navigation.footer
extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/matteo-meli-45ba9946
    - icon: fontawesome/brands/github
      link: https://github.com/matteomeli
copyright: Copyright &copy; 2025 Matteo Meli
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - index.md
  - miscellanea.md
  - about.md
